name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  # O postinstall do onnxruntime-node baixa, no Linux x64, os binários de GPU
  # (CUDA 12 e TensorRT, centenas de MB). O app roda o modelo de busca só na
  # CPU, cujo binário já vem no pacote; sem isto, o AppImage da v0.16.0 saiu
  # com 427 MB em vez de ~190 MB.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  criar-release:
    name: Criar o release
    runs-on: ubuntu-latest
    # O release é criado UMA vez, antes dos jobs de empacotamento. Deixar a
    # criação para o electron-builder não basta: no Windows ele publica o
    # instalador e o blockmap em paralelo, e os dois uploads criaram cada um o
    # seu release na v0.16.0, com os arquivos divididos entre eles. Com o
    # release já existente, todo job só anexa arquivos.
    steps:
      - name: Criar o release da tag, se ainda não existir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG já existe."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "${TAG#v}" --notes ""
          fi

  release:
    name: Empacotar e publicar (${{ matrix.os }})
    needs: criar-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      # Os três jobs rodam `--publish always` contra a mesma tag, e o GitHub
      # aceita releases duplicados (a v0.2.0 saiu com dois). O release agora
      # nasce em `criar-release`; a serialização fica como segunda barreira,
      # para que dois jobs nunca disputem o mesmo release ao mesmo tempo.
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Baixar o binário do Electron
        # Desde o Electron 44, o `npm ci` não baixa mais o binário: o download
        # acontece no primeiro `require('electron')`. Nos testes, vários workers
        # do vitest fazem esse require ao mesmo tempo e os downloads colidem no
        # mesmo diretório (`File exists`), o que derrubou a release v0.16.0 no
        # Linux e no macOS. Baixar uma vez, aqui, elimina a corrida.
        run: node node_modules/electron/install.js

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Testes de unidade e gates de segurança
        # Os três gates do §13.5 são bloqueantes também aqui: nenhuma release
        # sai sem eles.
        run: npm test

      - name: Configurar assinatura de código
        # Assinatura — pendência §15.3, com custo anual. Enquanto os segredos não
        # existirem, `secrets.CSC_LINK` chega como string vazia, e o
        # electron-builder tenta ler essa string como caminho do certificado
        # (`⨯ ... not a file`, que derrubou o job do macOS na v0.2.0). Por isso as
        # variáveis só são definidas quando há segredo de verdade; sem ele, os
        # instaladores saem sem assinatura e disparam SmartScreen (Windows) e
        # Gatekeeper (macOS).
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            {
              echo "CSC_LINK<<__EOF__"
              echo "$CSC_LINK_SECRET"
              echo "__EOF__"
              echo "CSC_KEY_PASSWORD<<__EOF__"
              echo "$CSC_KEY_PASSWORD_SECRET"
              echo "__EOF__"
            } >> "$GITHUB_ENV"
            echo "Certificado presente: empacotando com assinatura."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "Sem certificado: empacotando sem assinatura (§15.3)."
          fi

      - name: Empacotar e publicar
        # `--publish always` cria (ou atualiza) o release no GitHub e gera os
        # manifestos `latest.yml` / `latest-mac.yml` / `latest-linux.yml` que o
        # electron-updater consome (§15.2, §15.3).
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A notarização só é tentada quando as credenciais da Apple existem;
          # vazias, o electron-builder simplesmente as ignora.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
